# Tests Tidy and builds Tidy.dmg on every push. On main it also publishes the disk image as a
# release, which is where Tidy's Update Tidy button gets new versions from.
name: Build Tidy

on:
  push:
    branches: [main, "dev/**"]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Each test runs in its own process, so a test that crashes is named and the rest still run.
      - name: Test
        run: swift test --parallel

      - name: Build Tidy.app and Tidy.dmg
        run: NO_OPEN=1 scripts/make-app.sh

      - name: Keep the disk image with this run
        uses: actions/upload-artifact@v4
        with:
          name: Tidy.dmg
          path: build/Tidy.dmg

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Tidy.app/Contents/Info.plist)"
          # The release notes are the merged pull request's title and description, or the commit
          # message when the change didn't come through a pull request.
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[0] | select(. != null) | .title + "\n\n" + ((.body // "") | gsub("\r"; ""))' \
            > release-notes.txt || true
          [ -s release-notes.txt ] || git log -1 --format=%B > release-notes.txt
          gh release create "build-${BUILD}" build/Tidy.dmg \
            --title "Tidy ${VERSION}" \
            --notes-file release-notes.txt \
            --target "${GITHUB_SHA}" \
            --latest
